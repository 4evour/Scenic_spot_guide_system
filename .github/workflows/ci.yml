name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 测试库密码每次 CI 运行动态生成(基于 run_id),避免在 workflow 中硬编码固定密码,
    # 消除"秘密入库"的坏习惯被误用到生产配置的风险。
    env:
      TEST_DB_PASSWORD: ci-test-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scenic_guide_test
          POSTGRES_USER: scenic
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenic -d scenic_guide_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          SCENIC_GUIDE_DATABASE_DRIVER: postgres
          SCENIC_GUIDE_DATABASE_HOST: 127.0.0.1
          SCENIC_GUIDE_DATABASE_PORT: 5432
          SCENIC_GUIDE_DATABASE_NAME: scenic_guide_test
          SCENIC_GUIDE_DATABASE_USER: scenic
          SCENIC_GUIDE_DATABASE_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        run: go test ./...

      - name: Vet
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-vue/package-lock.json

      - name: Install dependencies
        working-directory: web-vue
        run: npm ci

      - name: Encoding check
        working-directory: web-vue
        run: npm run check:encoding

      - name: Secret scan
        run: node scripts/check-secrets.mjs

      - name: Type check
        working-directory: web-vue
        run: npm run check

      - name: Build
        working-directory: web-vue
        run: npm run build

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景区导览服务 AI 数字人</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=64ca7624c4f373ec3b123b2298b81019"></script>
    <script type="text/javascript" src="https://webapi.amap.com/ui/1.1/main.js"></script>
</head>
<body>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>欢迎登录</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('login')">登录</button>
                    <button class="tab-btn" onclick="showTab('register')">注册</button>
                </div>
                <div id="login" class="tab-content active">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginUsername">用户名</label>
                            <input type="text" id="loginUsername" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">密码</label>
                            <input type="password" id="loginPassword" placeholder="请输入密码">
                        </div>
                        <button type="submit" class="submit-btn">登录</button>
                    </form>
                </div>
                <div id="register" class="tab-content">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regUsername">用户名</label>
                            <input type="text" id="regUsername" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="regPassword">密码</label>
                            <input type="password" id="regPassword" placeholder="请输入密码">
                        </div>
                        <div class="form-group">
                            <label for="regEmail">邮箱</label>
                            <input type="email" id="regEmail" placeholder="请输入邮箱">
                        </div>
                        <button type="submit" class="submit-btn">注册</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-map-marked-alt"></i>
            <span>景区导览系统</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" id="homeBtn"><i class="fas fa-home"></i> 首页</button>
            <button class="nav-btn" id="spotsBtn"><i class="fas fa-landmark"></i> 景点</button>
            <button class="nav-btn" id="routesBtn"><i class="fas fa-route"></i> 路线</button>
            <button class="nav-btn" id="chatBtn" onclick="window.location.href='http://localhost:12393'"><i class="fas fa-comments"></i> 智能导览</button>
            <button class="nav-btn" id="profileBtn"><i class="fas fa-user"></i> 个人中心</button>
            <button class="nav-btn nav-admin" onclick="window.location.href='/static/dashboard.html'"><i class="fas fa-chart-line"></i> 数据大屏</button>
            <button class="nav-btn nav-admin" onclick="window.location.href='/static/admin.html'"><i class="fas fa-cog"></i> 管理后台</button>
        </div>
        <div class="nav-user">
            <span id="userName">游客</span>
            <button class="login-btn" id="loginBtn">登录</button>
        </div>
    </nav>

    <main class="main-content">
        <section id="homeSection" class="section active">
            <div class="hero-section">
                <div class="hero-content">
                    <h1>AI 智能导览助手</h1>
                    <p>探索灵山胜境，开启智慧之旅</p>
                    <div class="hero-buttons">
                        <button class="btn-primary" onclick="window.location.href='http://localhost:12393'">
                            <i class="fas fa-user-circle"></i> 数字人导览
                        </button>
                        <button class="btn-primary" onclick="goToSection('spotsBtn')">浏览景点</button>
                        <button class="btn-secondary" onclick="goToSection('chatBtn')">智能问答</button>
                    </div>
                </div>
            </div>

            <div class="features-section">
                <div class="feature-card" onclick="window.location.href='http://localhost:12393'" style="cursor: pointer;">
                    <i class="fas fa-user-circle"></i>
                    <h3>数字人导览</h3>
                    <p>AI数字人"小灵"为您服务</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-map-marked-alt"></i>
                    <h3>智能导航</h3>
                    <p>实时定位，精准导航</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-comments"></i>
                    <h3>AI问答</h3>
                    <p>智能问答，实时解答</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-route"></i>
                    <h3>路线规划</h3>
                    <p>最优路线，省时省力</p>
                </div>
            </div>

            <div class="map-section">
                <div class="map-controls">
                    <button class="map-btn" id="gpsBtn">
                        <i class="fas fa-map-marker-alt"></i> 定位
                    </button>
                    <button class="map-btn" id="navBtn">
                        <i class="fas fa-navigation"></i> 导航
                    </button>
                </div>
                <div id="mapContainer" class="map-container">
                    <div class="map-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>加载地图中...</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="spotsSection" class="section">
            <div class="section-header">
                <h2><i class="fas fa-landmark"></i> 景区景点</h2>
                <div class="filter-tabs">
                    <button class="filter-btn active" data-category="all">全部</button>
                    <button class="filter-btn" data-category="自然">自然景观</button>
                    <button class="filter-btn" data-category="人文">人文历史</button>
                    <button class="filter-btn" data-category="娱乐">娱乐设施</button>
                </div>
            </div>
            <div id="spotsGrid" class="spots-grid">
            </div>
        </section>

        <section id="routesSection" class="section">
            <div class="section-header">
                <h2><i class="fas fa-route"></i> 游览路线</h2>
                <div class="filter-tabs">
                    <button class="filter-btn active" data-difficulty="all">全部难度</button>
                    <button class="filter-btn" data-difficulty="easy">轻松</button>
                    <button class="filter-btn" data-difficulty="medium">适中</button>
                    <button class="filter-btn" data-difficulty="hard">挑战</button>
                </div>
            </div>
            <div id="routesList" class="routes-list">
            </div>
        </section>

        <section id="chatSection" class="section">
            <div class="chat-container">
                <div class="chat-header">
                    <h2><i class="fas fa-comments"></i> AI 智能导览</h2>
                    <div class="chat-options">
                        <label class="auto-speak-toggle">
                            <input type="checkbox" id="autoSpeak" checked>
                            <span>自动语音</span>
                        </label>
                        <button class="clear-btn" id="clearChat">清空对话</button>
                    </div>
                </div>
                <div id="chatMessages" class="chat-messages">
                    <div class="message bot-message">
                        <div class="avatar">🤖</div>
                        <div class="message-content">
                            <p>您好！我是您的AI导览助手，有什么可以帮助您的吗？</p>
                        </div>
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="输入您的问题...">
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                    <button class="voice-btn" id="voiceBtn"><i class="fas fa-microphone"></i></button>
                </div>
            </div>
        </section>

        <section id="profileSection" class="section">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="profile-info">
                        <h2 id="profileName">未登录用户</h2>
                        <p id="profileEmail">请登录以查看个人信息</p>
                    </div>
                </div>
                <div class="profile-menu">
                    <button class="profile-btn" id="updateProfileBtn">
                        <i class="fas fa-user-edit"></i> 修改资料
                    </button>
                    <button class="profile-btn" id="myQueriesBtn">
                        <i class="fas fa-question-circle"></i> 我的问题
                    </button>
                    <button class="profile-btn admin-btn" id="adminBtn" style="display:none">
                        <i class="fas fa-shield-alt"></i> 管理员面板
                    </button>
                    <button class="profile-btn logout-btn" id="logoutBtn" style="display:none">
                        <i class="fas fa-sign-out-alt"></i> 退出登录
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 景区导览服务 AI 数字人. 保留所有权利.</p>
    </footer>

    <div id="digitalHumanContainer" class="digital-human-container">
        <div class="digital-human-header">
            <div class="digital-human-info">
                <span class="status-dot"></span>
                <span id="digitalHumanName">数字人导览员</span>
            </div>
            <button class="dh-close-btn" onclick="toggleDigitalHuman()">×</button>
        </div>
        <div class="digital-human-body">
            <div class="digital-human-avatar" data-emotion="friendly">
                <div class="avatar-face">
                    <div class="avatar-eyes">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                    </div>
                    <div class="avatar-mouth"></div>
                </div>
                <div class="avatar-body">
                    <div class="avatar-torso"></div>
                </div>
                <div class="avatar-glow"></div>
            </div>
            <div class="digital-human-controls">
                <button class="dh-voice-btn" onclick="startVoiceInput()">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="dh-speak-btn" onclick="toggleSpeak()">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="dh-emotion-btn" onclick="cycleEmotion()">
                    <i class="fas fa-smile"></i>
                </button>
            </div>
        </div>
        <div id="digitalHumanMessage" class="digital-human-message">
            您好！我是您的AI数字人导览员
        </div>
        <div class="digital-human-actions">
            <button class="dh-action-btn" onclick="goToSection('spotsBtn')">
                <i class="fas fa-landmark"></i> 浏览景点
            </button>
            <button class="dh-action-btn" onclick="goToSection('routesBtn')">
                <i class="fas fa-route"></i> 推荐路线
            </button>
            <button class="dh-action-btn primary" onclick="goToSection('chatBtn')">
                <i class="fas fa-comments"></i> 智能问答
            </button>
        </div>
    </div>

    <button id="toggleDHBtn" class="toggle-digital-human">
        <i class="fas fa-user-circle"></i>
        <span>数字人</span>
    </button>

    <script src="/static/js/app.js"></script></body>
</html>

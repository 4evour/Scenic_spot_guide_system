<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵山胜境 · 智能导览</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- TODO: API Key 应通过构建环境注入，避免在源码中硬编码。在高德平台配置 Referer 白名单限制调用来源。 -->
    <meta name="scenic-amap-key" content="">
</head>
<body>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>欢迎登录</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('login')">登录</button>
                    <button class="tab-btn" onclick="showTab('register')">注册</button>
                </div>
                <div id="login" class="tab-content active">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginUsername">用户名</label>
                            <input type="text" id="loginUsername" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">密码</label>
                            <input type="password" id="loginPassword" placeholder="请输入密码">
                        </div>
                        <button type="submit" class="submit-btn">登录</button>
                    </form>
                </div>
                <div id="register" class="tab-content">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regUsername">用户名</label>
                            <input type="text" id="regUsername" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="regPassword">密码</label>
                            <input type="password" id="regPassword" placeholder="请输入密码">
                        </div>
                        <div class="form-group">
                            <label for="regEmail">邮箱</label>
                            <input type="email" id="regEmail" placeholder="请输入邮箱">
                        </div>
                        <button type="submit" class="submit-btn">注册</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-map-marked-alt"></i>
            <span>景区导览系统</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" id="homeBtn"><i class="fas fa-home"></i> 首页</button>
            <button class="nav-btn" id="spotsBtn"><i class="fas fa-landmark"></i> 景点</button>
            <button class="nav-btn" id="routesBtn"><i class="fas fa-route"></i> 路线</button>
            <button class="nav-btn" id="chatBtn"><i class="fas fa-comments"></i> 智能导览</button>
            <button class="nav-btn" id="profileBtn"><i class="fas fa-user"></i> 个人中心</button>
        </div>
        <div class="nav-user">
            <span id="userName">游客</span>
            <button class="login-btn" id="loginBtn">登录</button>
        </div>
    </nav>

    <main class="main-content">
        <section id="homeSection" class="section active">
            <div class="hero-section">
                <div class="hero-content">
                    <h1>AI 智能导览助手</h1>
                    <p>探索灵山胜境，开启智慧之旅</p>
                    <div class="hero-buttons">
                        <button class="btn-primary" onclick="openDigitalHuman()">
                            <i class="fas fa-user-circle"></i> 数字人导览
                        </button>
                        <button class="btn-primary" onclick="goToSection('spotsBtn')">浏览景点</button>
                        <button class="btn-secondary" onclick="openDigitalHuman()">智能问答</button>
                    </div>
                </div>
            </div>

            <div class="features-section">
                <div class="feature-card" onclick="openDigitalHuman()" style="cursor: pointer;">
                    <i class="fas fa-user-circle"></i>
                    <h3>数字人导览</h3>
                    <p>AI数字人"小灵"为您服务</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-map-marked-alt"></i>
                    <h3>智能导航</h3>
                    <p>实时定位，精准导航</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-comments"></i>
                    <h3>AI问答</h3>
                    <p>智能问答，实时解答</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-route"></i>
                    <h3>路线规划</h3>
                    <p>最优路线，省时省力</p>
                </div>
            </div>

            <div class="map-section">
                <div class="map-controls">
                    <button class="map-btn" id="gpsBtn">
                        <i class="fas fa-map-marker-alt"></i> 定位
                    </button>
                    <button class="map-btn" id="navBtn">
                        <i class="fas fa-navigation"></i> 导航
                    </button>
                </div>
                <div id="mapContainer" class="map-container">
                    <div class="map-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>加载地图中...</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="spotsSection" class="section">
            <div class="section-header">
                <h2><i class="fas fa-landmark"></i> 景区景点</h2>
                <div class="filter-tabs">
                    <button class="filter-btn active" data-category="all">全部</button>
                    <button class="filter-btn" data-category="自然">自然景观</button>
                    <button class="filter-btn" data-category="人文">人文历史</button>
                    <button class="filter-btn" data-category="娱乐">娱乐设施</button>
                </div>
            </div>
            <div id="spotsGrid" class="spots-grid">
            </div>
        </section>

        <section id="routesSection" class="section">
            <div class="section-header">
                <h2><i class="fas fa-route"></i> 游览路线</h2>
                <div class="filter-tabs">
                    <button class="filter-btn active" data-difficulty="all">全部难度</button>
                    <button class="filter-btn" data-difficulty="easy">轻松</button>
                    <button class="filter-btn" data-difficulty="medium">适中</button>
                    <button class="filter-btn" data-difficulty="hard">挑战</button>
                </div>
            </div>
            <div id="routesList" class="routes-list">
            </div>
        </section>

        <section id="profileSection" class="section">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="profile-info">
                        <h2 id="profileName">未登录用户</h2>
                        <p id="profileEmail">请登录以查看个人信息</p>
                    </div>
                </div>
                <div class="profile-menu">
                    <button class="profile-btn" id="updateProfileBtn">
                        <i class="fas fa-user-edit"></i> 修改资料
                    </button>
                    <button class="profile-btn" id="myQueriesBtn">
                        <i class="fas fa-question-circle"></i> 我的问题
                    </button>
                    <button class="profile-btn admin-btn" id="adminBtn" style="display:none">
                        <i class="fas fa-shield-alt"></i> 管理员面板
                    </button>
                    <button class="profile-btn logout-btn" id="logoutBtn" style="display:none">
                        <i class="fas fa-sign-out-alt"></i> 退出登录
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 灵山胜境智能导览系统 · 基于 RAG 检索增强生成技术</p>
    </footer>

    <button id="toggleDHBtn" class="toggle-digital-human">
        <i class="fas fa-user-circle"></i>
        <span>数字人</span>
    </button>

    <script src="/static/js/app.js"></script></body>
</html>

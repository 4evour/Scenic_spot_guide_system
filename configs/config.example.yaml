# Scenic Guide - Example Configuration
# Copy this file to config.yaml and fill in your values.
# NEVER commit config.yaml with real credentials.

server:
  host: "0.0.0.0"
  port: "8080"

database:
  # Options: "postgres" (recommended for production), "sqlite" (local dev only)
  driver: "sqlite"
  # PostgreSQL settings (uncomment for production):
  # host: "127.0.0.1"
  # port: 5432
  # name: "scenic_guide"
  # user: "scenic"
  # password: ""
  # max_open_conns: 25
  # max_idle_conns: 10
  # conn_max_lifetime_minutes: 30
  # SQLite path (dev only):
  path: "./data/scenic_guide.db"

logging:
  level: "info"
  output: "console"

ai:
  # Get your key from https://platform.deepseek.com
  api_key: ""
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

embedding:
  # Get your key from https://dashscope.console.aliyun.com
  api_key: ""
  model: "text-embedding-v2"
  base_url: "https://dashscope.aliyuncs.com/api/v1"

speech:
  api_key: ""
  region: ""

security:
  # IMPORTANT: Generate a random 32+ character secret.
  # Example: openssl rand -hex 32
  # The placeholder below WILL be rejected at startup.
  jwt_secret: "REPLACE_WITH_RANDOM_32_CHAR_SECRET"
  token_expire_hours: 4

# Scenic Guide - Example Configuration
# Copy this file to config.yaml and fill in your values.
# NEVER commit config.yaml with real credentials.
# Sensitive fields (api_key, jwt_secret) MUST be set via environment variables.

server:
  host: "0.0.0.0"
  port: "8080"

scenic_profile: "lingshan"

database:
  # Options: "postgres" (recommended for production), "sqlite" (local dev only)
  driver: "sqlite"
  # PostgreSQL settings (uncomment for production):
  # host: "127.0.0.1"
  # port: 5432
  # name: "scenic_guide"
  # user: "scenic"
  # password: ""
  # max_open_conns: 25
  # max_idle_conns: 10
  # conn_max_lifetime_minutes: 30
  # SQLite path (dev only):
  path: "./data/scenic_guide.db"

logging:
  level: "info"
  output: "console"

ai:
  api_key: ""          # 通过 SCENIC_GUIDE_AI_API_KEY 环境变量注入
  model: "qwen-vl-max"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

embedding:
  api_key: ""          # 通过 SCENIC_GUIDE_EMBEDDING_API_KEY 环境变量注入
  model: "text-embedding-v2"
  base_url: "https://dashscope.aliyuncs.com/api/v1"

speech:
  api_key: ""
  region: ""

security:
  # IMPORTANT: Set via SCENIC_GUIDE_SECURITY_JWT_SECRET environment variable.
  # Generate: openssl rand -hex 32
  jwt_secret: ""       # 通过 SCENIC_GUIDE_SECURITY_JWT_SECRET 环境变量注入
  token_expire_hours: 24
  # CORS allowed origins. If empty, defaults to localhost:8080 and localhost:5173.
  # Add your production domain here.
  # allowed_origins:
  #   - "https://your-domain.com"

# Redis (optional) — enables distributed rate limiting across multiple instances.
# Leave addr empty to use in-memory rate limiting.
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
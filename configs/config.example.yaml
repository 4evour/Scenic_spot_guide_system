server:
  host: "0.0.0.0"
  port: "8080"

database:
  # 默认使用 PostgreSQL 主配置；本地轻量运行可显式改为 sqlite 并设置 path。
  # SQLite 不是 PostgreSQL 故障后的自动接管方案，不承担高可用或数据同步语义。
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  name: "scenic_guide"
  user: "scenic"
  password: "scenic_dev_password"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime_minutes: 30
  # sqlite local/dev profile:
  # driver: "sqlite"
  path: "./data/scenic_guide.db"

logging:
  level: "info"
  output: "console"

ai:
  api_key: ""
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

embedding:
  api_key: ""
  model: "text-embedding-v2"
  base_url: "https://dashscope.aliyuncs.com/api/v1"

speech:
  api_key: ""
  region: ""

security:
  jwt_secret: "change-this-to-a-random-32-character-secret"
  token_expire_hours: 4
